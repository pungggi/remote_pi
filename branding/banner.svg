<?xml version="1.0" encoding="UTF-8"?>
<!-- Piper — package banner (1280×640). P mark on the left + name + tagline + install + repo.
     Used for the pi.dev package card (pi.image), GitHub README hero, social preview. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#000000"/>

  <defs>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="280" cy="320" r="280" fill="url(#accentGlow)"/>

  <!-- Piper "P" mark — scale 0.42, positioned in the left panel -->
  <g transform="translate(72, 96) scale(0.42)">
    <g fill="#FFFFFF">
      <rect x="312" y="272" width="96" height="500" rx="18"/>
      <rect x="312" y="272" width="400" height="96" rx="18"/>
      <rect x="616" y="272" width="96" height="300" rx="18"/>
      <rect x="400" y="476" width="312" height="96" rx="18"/>
    </g>
    <circle cx="512" cy="422" r="46" fill="#00ff41"/>
  </g>

  <text x="560" y="288"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="104"
        font-weight="700"
        fill="#FFFFFF"
        letter-spacing="-1">Piper</text>

  <text x="560" y="346"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26"
        font-weight="400"
        fill="#B0BEC5">Your coding agents, in your pocket</text>

  <text x="560" y="402"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="22"
        font-weight="500"
        fill="#00ff41">pi install git:github.com/pungggi/remote_pi</text>

  <rect x="560" y="430" width="72" height="3" rx="1.5" fill="#00ff41"/>

  <text x="560" y="474"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#78909C">github.com/pungggi/remote_pi</text>
</svg>
